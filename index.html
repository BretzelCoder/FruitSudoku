<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Fruits & Légumes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <h1>🍎 Sudoku Fruits & Légumes 🥕</h1>
        
        <div id="menuScreen" class="menu-screen">
            <div class="theme-selector">
                <h2>Choisissez votre thème :</h2>
                <div class="theme-buttons" id="menuThemeButtons"></div>
            </div>
            <div class="legend" id="themeLegend"></div>
            <h2>Choisissez votre niveau de difficulté :</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn facile" data-difficulty="facile">
                    🌱 Facile<br><small>40 indices</small>
                </button>
                <button class="difficulty-btn moyen" data-difficulty="moyen">
                    🌿 Moyen<br><small>30 indices</small>
                </button>
                <button class="difficulty-btn difficile" data-difficulty="difficile">
                    🌳 Difficile<br><small>25 indices</small>
                </button>
            </div>
        </div>

        <div id="gameScreen" class="game-screen hidden">
            <div class="game-info">
                <div class="info-item">⏱️ Temps: <span id="timer">00:00</span></div>
                <div class="info-item">💡 Aides: <span id="helpCount">0</span></div>
                <div class="info-item">🎨 Thème: <span id="currentTheme">-</span></div>
                <div class="info-item">📊 Niveau: <span id="currentLevel">-</span></div>
                <div class="info-item">✅ Vérification: <span id="verifyStatus">-</span></div>
            </div>

            <div class="controls">
                <button class="control-btn help-btn" id="hintBtn">💡 Aide</button>
                <button class="control-btn verify-btn" id="verifyBtn">✅ Vérifier</button>
                <button class="control-btn theme-switch-btn" id="themeSwitchBtn">🎨 Changer thème</button>
                <button class="control-btn restart-btn" id="restartBtn">🔄 Recommencer</button>
                <button class="control-btn menu-btn" id="menuBtn">🏠 Menu</button>
            </div>

            <div class="sudoku-grid" id="sudokuGrid"></div>
            <div class="symbol-selector" id="symbolSelector"></div>
        </div>

        <div id="victoryModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h2>🎉 Félicitations ! 🎉</h2>
                <div class="victory-stats">
                    <p>⏱️ Temps: <span id="finalTime">-</span></p>
                    <p>💡 Aides: <span id="finalHelps">-</span></p>
                    <p>📊 Niveau: <span id="finalLevel">-</span></p>
                </div>
                <button class="difficulty-btn facile" id="victoryMenuBtn">🏠 Retour au menu</button>
            </div>
        </div>

        <div id="themeModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>🎨 Changer de thème</h3>
                <div class="theme-buttons" id="modalThemeButtons"></div>
                <button class="control-btn menu-btn" id="closeThemeModalBtn">❌ Fermer</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sudoku-generator.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
